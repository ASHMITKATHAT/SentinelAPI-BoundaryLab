name: BoundaryLab verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/service/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install service
        run: python -m pip install -e './apps/service[dev]'
      - name: Test service
        working-directory: apps/service
        run: python -m pytest -q -p no:cacheprovider
      - name: Build web client
        working-directory: apps/web
        run: npm ci && npm run build
      - name: Validate contracts and documentation
        run: python tools/validate_pack.py
      - name: Build and smoke-test hardened container
        shell: bash
        run: |
          docker build --tag boundarylab:ci .
          CONTAINER_ID=$(docker run --detach \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --tmpfs /data:rw,noexec,nosuid,size=64m,mode=1777 \
            --env BOUNDARYLAB_BOOTSTRAP_SECRET=ci-container-boundary-secret \
            --publish 127.0.0.1:18080:8080 \
            boundarylab:ci)
          trap 'docker rm --force "$CONTAINER_ID" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/api/healthz | grep --quiet '"version":"0.3.0"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$CONTAINER_ID"
          exit 1
      - name: Run live authorization gate against fixed build
        shell: bash
        run: |
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          python -m boundarylab.devserver --bootstrap-secret ci-only-boundary-secret --data-dir var/ci > /tmp/boundarylab.log 2>&1 &
          SERVER_PID=$!
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:9013/healthz && break
            sleep 1
          done
          python -m boundarylab.cli gate --target http://127.0.0.1:9013 --alias ci-fixed
