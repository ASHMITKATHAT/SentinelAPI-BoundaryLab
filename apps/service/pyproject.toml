[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "boundarylab"
version = "0.1.0"
description = "Deterministic authorization lifecycle scanner for SentinelAPI BoundaryLab"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.117,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=0.25,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/boundarylab"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
